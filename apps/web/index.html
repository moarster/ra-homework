<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мониторинг карьерных самосвалов</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки светлого фона.
      (() => {
        const fromUrl = new URLSearchParams(location.search).get('theme');
        const stored = localStorage.getItem('ra.theme');
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const theme = fromUrl === 'dark' || fromUrl === 'light' ? fromUrl : (stored ?? system);
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
